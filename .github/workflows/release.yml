# Publish each release as a ready-built component, for users who install org
# with `require_release` instead of building it (lattice PRL.8).
#
# `scripts/release.sh` tags; pushing the tag runs this. lattice's reusable
# workflow checks the tag is the crate version, builds with lattice's
# `scripts/build-plugin.sh`, and attaches `org-<version>-api<M>.<m>.wasm` and
# its `.sha256` to a GitHub release whose notes are the tag's message — the
# CHANGELOG section `release.sh` promoted.
name: release

on:
  push:
    tags: ['v*']

jobs:
  # A release goes out green or not at all. The tag push starts this and the
  # push to main starts `ci` separately, with nothing joining them — v0.1.2
  # was published 54 s in, while its CI was still running. So CI runs here,
  # against the tagged commit, and the release waits for it.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    uses: dhruvasagar/lattice/.github/workflows/plugin-release.yml@main
    permissions:
      contents: write
