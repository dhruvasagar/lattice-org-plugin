# The reference org language plugin (LG.4).
#
# Lives outside the lattice tree, which is the point: it is the thing a user's
# plugin manager clones and builds on boot (PM.5–PM.8), and the shape a real
# language plugin takes. Nothing in lattice knows what org is.
#
# The component is a `wasm32-wasip2` cdylib:
#
#     cargo build --release --target wasm32-wasip2
#
# `cargo test` builds this crate for the HOST instead, so the integration
# tests below load the wasm artefact from `target/wasm32-wasip2/release/` and
# SKIP when it is absent. Build the component first or they test nothing.
[package]
name = "lattice-org-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
# OC.2: `org.capture-templates` is a string option whose VALUE is TOML —
# forced, because an option is `boolean | integer | string` and capture
# templates are records. The guest re-parses it, so the parser ships inside the
# component. Hand-rolling one was rejected: `"""` blocks, escapes and inline
# tables are exactly where a hand-rolled parser gets a user's template subtly
# wrong, and a template that parses to the wrong thing is worse than one that
# fails to parse.

# TC.4: `#[derive(ConfigShape)]` — a Rust struct as a config schema and value,
# plus the arena flattening the WIT config seam takes. WIT-agnostic pure Rust,
# so it compiles to wasm32-wasip2 like the rest of the component.
lattice-plugin-sdk = { path = "../lattice/crates/lattice-plugin-sdk" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# OR.4: the roam index's on-store encoding. The store holds opaque bytes and the
# GUEST owns the schema, so the format is this plugin's choice — MessagePack,
# because the records are structs of strings and a text format would double the
# size of a blob the picker reads on every open. Pure-Rust and wasm-friendly,
# and the same crate the SDK already uses for plugin event payloads.
rmp-serde = "1.3"


# The moved-from-lattice integration tests drive a REAL editor: they boot one,
# load this plugin's component through the loader, and dispatch chords. That
# needs the host crates, so `cargo test` here compiles the editor.
#
# PATH deps against a local lattice checkout — portable enough for the author,
# not for a stranger cloning this repo. Switch to `git = ...` (pinned to the
# lattice tag whose `wit/` is vendored here) before anyone else needs to run
# them; the vendored WIT and these deps must describe the SAME lattice, or the
# component builds against one ABI and is tested against another.
[build-dependencies]
# WT.2: the lattice plugin API package. Writing it into `wit/` at build time is
# what stops this repo's copy drifting behind the editor's — which is exactly
# what happened, three ABI changes in one day, with the only symptom being that
# org silently stopped loading.
#
# A path dep while lattice is unreleased, matching the dev-dependencies below.
# Once `lattice-wit` is published this becomes a version pin, and a plugin then
# declares the ABI it targets the way it declares everything else.
lattice-wit = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-wit" }

[dev-dependencies]
# TC.6: the production path never parses TOML — the options are declared shapes
# now — but TOML is still the nicest way to WRITE a fixture, and the alternative
# is pages of nested `Value::record([...])` in which a test's intent disappears.
# `config_shape::from_toml` turns a fixture into the tree the code receives.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
lattice-core = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-core" }
# MO.3: the test reads the resolved `foldmethod` for an org buffer, which means
# naming the option's declaration type (`FoldMethodOption`) — it lives here.
lattice-config = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-config" }
# TK.3: the test asserts the component's TODO elements land in the SAME
# registry builtins use, and resolve to real colours.
lattice-theme = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-theme" }
lattice-grammar = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-grammar" }
lattice-host = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-host" }
lattice-keymap = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-keymap" }
lattice-mode = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-mode" }
lattice-plugin-host = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-plugin-host" }
lattice-plugin-loader = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-plugin-loader" }
lattice-runtime = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-runtime" }
lattice-protocol = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-protocol" }
lattice-syntax = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-syntax" }
lattice-multibuffer = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-multibuffer" }
# OC.3: the tests reach the editor's transient registry to prove the capture
# menu registered into it and builds through it.
lattice-picker = { path = "/Users/dhruva/src/dhruvasagar/lattice/crates/lattice-picker" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
arc-swap = "1"
# OR.10: the dailies tests need TODAY in local time — the same answer the guest
# gets, from the same source. `local-utc-offset-seconds` is implemented as
# `chrono::Local::now().offset()`, so the test asks chrono directly rather than
# re-deriving an offset from `SystemTime`, which would be a second
# implementation of the thing under test. Hardcoding a date would instead make
# the tests fail once a day.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# OC.6: `lattice_plugin_host::Sleeper` returns a `BoxFuture`, so the test's
# tokio-backed impl of it names the type. The plugin host owns no runtime by
# design, which is why the timer is the caller's to supply — here, the test's.
futures = "0.3"

[profile.release]
opt-level = "s"
strip = true

[workspace]
