# The reference org language plugin (LG.4).
#
# Lives outside the lattice tree, which is the point: it is the thing a user's
# plugin manager clones and builds on boot (PM.5–PM.8), and the shape a real
# language plugin takes. Nothing in lattice knows what org is.
#
# The component is a `wasm32-wasip2` cdylib:
#
#     cargo build --release --target wasm32-wasip2
#
# `cargo test` builds this crate for the HOST instead, so the integration
# tests below load the wasm artefact from `target/wasm32-wasip2/release/` and
# SKIP when it is absent. Build the component first or they test nothing.
[package]
name = "lattice-org-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
# OC.2: `org.capture-templates` is a string option whose VALUE is TOML —
# forced, because an option is `boolean | integer | string` and capture
# templates are records. The guest re-parses it, so the parser ships inside the
# component. Hand-rolling one was rejected: `"""` blocks, escapes and inline
# tables are exactly where a hand-rolled parser gets a user's template subtly
# wrong, and a template that parses to the wrong thing is worse than one that
# fails to parse.

# TC.4: `#[derive(ConfigShape)]` — a Rust struct as a config schema and value,
# plus the arena flattening the WIT config seam takes. WIT-agnostic pure Rust,
# so it compiles to wasm32-wasip2 like the rest of the component.
lattice-plugin-sdk = "0.1"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# OR.4: the roam index's on-store encoding. The store holds opaque bytes and the
# GUEST owns the schema, so the format is this plugin's choice — MessagePack,
# because the records are structs of strings and a text format would double the
# size of a blob the picker reads on every open. Pure-Rust and wasm-friendly,
# and the same crate the SDK already uses for plugin event payloads.
rmp-serde = "1.3"
# OA.29: `sr`, the agenda's regexp filter. `regex-lite` rather than `regex`
# because this component is BUILT ON BOOT by the plugin manager and already
# ships as a 1.3M artefact — `regex`'s unicode tables are most of a megabyte
# spent on character classes an agenda filter does not reach for. Pure Rust and
# dependency-free, so it compiles for `wasm32-wasip2` like the rest of the guest.
#
# The cost it does carry: no `\p{…}` unicode classes and no look-around. A
# pattern using them fails to COMPILE, which `ViewArgs::parse` reports in the
# headerline — the term is dropped rather than silently matching nothing, since
# an empty agenda that looks like a working filter is the worst answer here.
regex-lite = "0.1"


# The moved-from-lattice integration tests drive a REAL editor: they boot one,
# load this plugin's component through the loader, and dispatch chords. That
# needs the host crates, so `cargo test` here compiles the editor.
#
# These were ABSOLUTE paths into one laptop (`/Users/dhruva/...`), so this repo
# built on exactly one machine — `cargo build --release --target wasm32-wasip2`
# failed on Linux with "failed to load manifest for dependency". Note that it
# was the BUILD that failed, not just `cargo test`: dev-dependencies are part of
# the resolution graph, so a test-only dep that cannot resolve stops the plugin
# manager building this plugin on boot.
#
# Relative now, so they work for anyone with a sibling `lattice` checkout. That
# is the permanent answer for these fifteen: they are the editor's own host
# crates, they will never be on crates.io, and only a contributor runs them.
#
# It is NOT the answer for a stranger, who has no sibling checkout — the plugin
# manager clones into `~/.config/lattice/plugins/org`. Two things close that,
# and neither is done: the two dependencies this plugin actually needs to BUILD
# move to published versions (below), and these fifteen move into a separate
# test package so they stop gating the component's build at all.
[build-dependencies]
# WT.2: the lattice plugin API package. Writing it into `wit/` at build time is
# what stops this repo's copy drifting behind the editor's — which is exactly
# what happened, three ABI changes in one day, with the only symptom being that
# org silently stopped loading.
#
# Becomes `version = "0.1.0"` — with no `path` — the moment `lattice-wit` is on
# crates.io. That is what lets a plugin declare the ABI it targets the way it
# declares everything else, and it is the ONE change that makes this repo
# buildable by someone who has never cloned lattice. The crate is prepared for
# it: independently versioned, `description` set, and `wit/` now lives inside it
# so the published tarball actually contains the package.
lattice-wit = "0.1"

# Crates.io only, deliberately. A path dependency here would land in the BUILD
# graph and stop `cargo build --release --target wasm32-wasip2` for anyone
# without a lattice checkout — see `integration/Cargo.toml` for the whole
# argument. Anything a unit test needs from the editor goes in that package.
[dev-dependencies]
# TC.6: the production path never parses TOML — the options are declared shapes
# now — but TOML is still the nicest way to WRITE a fixture, and the alternative
# is pages of nested `Value::record([...])` in which a test's intent disappears.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = "s"
strip = true

[workspace]
# `integration/` is its own workspace and its own package: it carries the
# integration tests and the fifteen host crates they need. Excluded here so the
# component's resolution never reaches them — a dev-dependency that cannot
# resolve stops `cargo build`, and that is what made this repo buildable on
# exactly one machine.
exclude = ["integration", "grammar-src"]
