# The manifest the plugin manager stages beside the built component.
#
# It has to live HERE, at the source root, not only in the directory the
# manager stages into: `build::stage` copies this file next to the artifact,
# and a source with no `plugin.toml` fails the build outright ("source has no
# plugin.toml") rather than staging half a plugin. A `require`d local or git
# source without this file can never be installed.
id = "org"

# Every seam org contributes. The order is cosmetic — the loader sorts by real
# registration dependency before draining.
provides = [
    "language",
    "modes",
    "grammar",
    "config",
    "media",
    "agenda-source",
    "picker-source",
    # OC.3: the capture menu, one key per template.
    "transient-source",
    "help",
    # TK.3: one theme element per TODO state, so `org-todo-keyword-faces`
    # is an ordinary element override rather than a new mechanism.
    "theme",
    # OC.6: the clock's session, its minute wake and its modeline segment all
    # live on the event actor (design D6) — off the keystroke path by
    # construction. Without this seam the four clock chords still edit the
    # buffer correctly and the modeline simply never appears.
    "events",
]

# Publishes the enablement request for each mode named here. Without it a mode
# registers correctly and simply never activates — `auto_activatable_minors`
# filters on enablement — so the chords silently do nothing. This also
# auto-registers the single `org.enabled` gate that turns all of them on or off.
#
# `org-global-mode` is the universal `<C-x>o` prefix (agenda + capture), which
# has to be on wherever you are; `org-todo-mode` is keyword cycling inside org
# files. `org-table-mode` and `org-agenda-mode` are NOT here: the table minor
# activates with the major, and the agenda view's minor is activated by the
# provider that builds the view.
default_modes = ["org-todo-mode", "org-global-mode"]

# Archive (`<leader>o$`), refile (`<leader>or`) and capture (`<leader>oc`) all
# write to a file other than the one you are in, and the host checks the target
# against this grant at the plugin boundary. Point it at the directory your org
# files live in; without it those three chords are refused and say so, and
# everything else still works.
#
# capabilities = ["fs:write:/Users/you/org"]

# OT.4: the grammar seam is capability-gated, and without this grant it hands
# every motion, text object and action a `none` tree handle. Org then falls back
# to matching `*` at the start of a line — silently, and only in the built
# editor, which is exactly the divergence the tree migration exists to end. A
# plugin that registers an org grammar and then cannot read the tree it
# registered is the half-wiring this gate is meant to make visible, so it is
# declared here rather than assumed from `provides = ["language"]`.
editor_capabilities = ["tree-sitter"]
